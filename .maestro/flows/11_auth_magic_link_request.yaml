appId: club.foodshare.audiobookphile
name: Magic-link email can be requested
tags:
  - auth
---
# Credentials via generated subflow — see _login.yaml for why env vars can't
# be interpolated directly into inputText.
- runFlow: _credentials.yaml
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Connection Error"
    commands:
      - tapOn: "OK"
# Warm simulator keychains auto-sign-in and skip the connect form (see
# _login.yaml) — only the signed-out path can request a magic link.
- extendedWaitUntil:
    visible: "Sign In"
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible: "Sign In"
    commands:
      - runFlow:
          when:
            # See _login.yaml: the placeholder is visible only while the field is
            # empty, so pre-filled builds (ServerURL in Skip.env) skip typing.
            visible: "Server URL"
          commands:
            - tapOn:
                id: "abp_server_url_field"
            - inputText: ${output.server}
            - pressKey: Enter
      - tapOn:
          id: "abp_email_field"
      - inputText: ${output.email}
      - pressKey: Enter
      - scrollUntilVisible:
          element:
            id: "abp_magic_link_send"
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: "abp_magic_link_send"
      - extendedWaitUntil:
          visible: "Magic link sent! Check your email"
          timeout: 30000
