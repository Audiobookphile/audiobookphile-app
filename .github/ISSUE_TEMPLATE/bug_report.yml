name: Bug Report
description: Report a bug or unintended behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, device, and deployment type (e.g. Chrome 130 on macOS, Vercel production).
      placeholder: "e.g. Chrome 130 / macOS 15.1 / Vercel template"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Console Logs / Screenshots
      description: Paste any browser console errors or drag-and-drop screenshots here.
    validations:
      required: false
