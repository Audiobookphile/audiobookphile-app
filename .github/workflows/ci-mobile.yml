name: CI Mobile Verification (Skip & Swift)

on:
  push:
    branches: [ main ]
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'Project.xcworkspace/**'
      - '.github/workflows/ci-mobile.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - 'Package.resolved'
  workflow_dispatch:
concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-swift:
    name: SwiftLint
    runs-on: [self-hosted, macOS]
    # These three jobs had no timeout, so a wedged simulator or a Gradle daemon
    # that never returned held a self-hosted runner for the full 6-hour default.
    # With three repos sharing one host, a single hung job starves the others.
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        id: checkout
        uses: actions/checkout@v7

      - name: Host Pressure Preflight
        id: host
        run: ./scripts/host-pressure.sh

      - name: Install SwiftLint
        id: install
        run: |
          . .github/scripts/step-tree.sh
          step_tree "SwiftLint" install \
            "checkout:Checkout Repository|install:Install SwiftLint|lint:Run SwiftLint" \
            "checkout=${{ steps.checkout.outcome }}"
          which swiftlint >/dev/null 2>&1 || brew install swiftlint

      - name: Run SwiftLint
        id: lint
        run: |
          . .github/scripts/step-tree.sh
          step_tree "SwiftLint" lint \
            "checkout:Checkout Repository|install:Install SwiftLint|lint:Run SwiftLint" \
            "checkout=${{ steps.checkout.outcome }};install=${{ steps.install.outcome }}"
          swiftlint --strict

  skip-verify:
    name: Skip Cross-Platform Verify
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        id: checkout
        uses: actions/checkout@v7

      - name: Host Pressure Preflight
        id: host
        run: ./scripts/host-pressure.sh

      # Recorded BEFORE the Gradle build so the reap step below can tell this
      # job's daemons from daemons that were already on the shared host.
      - name: Snapshot Pre-existing Build Daemons
        id: daemons_before
        run: ./scripts/reap-daemons.sh --snapshot "$RUNNER_TEMP/daemons-before.txt"

      - name: Setup Java
        id: java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Skip
        id: install
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Skip Cross-Platform Verify" install \
            "checkout:Checkout Repository|java:Setup Java|install:Install Skip|verify:Skip Verify" \
            "checkout=${{ steps.checkout.outcome }};java=${{ steps.java.outcome }}"
          which skip >/dev/null 2>&1 || brew install skiptools/skip/skip

      - name: Skip Verify
        id: verify
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Skip Cross-Platform Verify" verify \
            "checkout:Checkout Repository|java:Setup Java|install:Install Skip|verify:Skip Verify" \
            "checkout=${{ steps.checkout.outcome }};java=${{ steps.java.outcome }};install=${{ steps.install.outcome }}"
          skip verify --fix

      # `skip verify` drives a real Gradle build, and Gradle leaves behind two
      # long-lived daemons: the Gradle daemon and the Kotlin compile daemon.
      # On a self-hosted runner those OUTLIVE the job -- measured on this host at
      # ~1.4 GB resident and ~440% CPU, still running long after the workflow had
      # finished, with 8 GB of swap in use. Every later job on the same box then
      # starts into a host that is already thrashing, which is how an unrelated
      # change comes back red.
      #
      # Only the daemons that appeared during THIS job are killed: the runners for
      # all three repos share this host with the developer's own work, and a
      # blanket `pkill -f KotlinCompileDaemon` from CI would reach into someone
      # else's in-flight Android build. The job's result is already recorded by
      # the step above, so reaping can never mask a failure.
      - name: Reap This Job's Build Daemons
        if: always()
        run: ./scripts/reap-daemons.sh --reap "$RUNNER_TEMP/daemons-before.txt"

  verify-swift:
    name: Verify Swift iOS Package
    runs-on: [self-hosted, macOS]
    # build-for-testing plus a simulator test run on a shared, memory-constrained
    # host. 45 is generous; the point is that it is not unbounded.
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        id: checkout
        uses: actions/checkout@v7

      - name: Host Pressure Preflight
        id: host
        run: ./scripts/host-pressure.sh

      - name: Select Xcode Toolchain
        id: toolchain
        run: |
          if [ -d "/Applications/Xcode-beta.app/Contents/Developer" ]; then
            DEV_DIR="/Applications/Xcode-beta.app/Contents/Developer"
          elif [ -d "/Applications/Xcode.app/Contents/Developer" ]; then
            DEV_DIR="/Applications/Xcode.app/Contents/Developer"
          else
            DEV_DIR="$(xcode-select -p)"
          fi
          echo "$DEV_DIR/Toolchains/XcodeDefault.xctoolchain/usr/bin" >> "$GITHUB_PATH"
          echo "DEVELOPER_DIR=$DEV_DIR" >> "$GITHUB_ENV"
          swift --version

      - name: Security Audit
        id: audit
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Verify Swift iOS Package" audit \
            "checkout:Checkout Repository|audit:Security Audit|resolve:Resolve Package Dependencies|build:Build & Typecheck Package|test:Run Unit Tests" \
            "checkout=${{ steps.checkout.outcome }}"
          ./scripts/security-audit.sh

      - name: Resolve Package Dependencies
        id: resolve
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Verify Swift iOS Package" resolve \
            "checkout:Checkout Repository|audit:Security Audit|resolve:Resolve Package Dependencies|build:Build & Typecheck Package|test:Run Unit Tests" \
            "checkout=${{ steps.checkout.outcome }};audit=${{ steps.audit.outcome }}"
          swift package resolve

      - name: Build & Typecheck Package
        id: build
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Verify Swift iOS Package" build \
            "checkout:Checkout Repository|audit:Security Audit|resolve:Resolve Package Dependencies|build:Build & Typecheck Package|test:Run Unit Tests" \
            "checkout=${{ steps.checkout.outcome }};audit=${{ steps.audit.outcome }};resolve=${{ steps.resolve.outcome }}"
          xcodebuild build-for-testing -scheme Audiobookphile -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO -quiet

      # `build-for-testing` only COMPILES the test bundle; it never runs it. The
      # App scheme's TestAction had an empty <Testables> list, so the
      # AudiobookphileTests target was never built and never executed anywhere
      # in CI -- the playback state machine had tests on disk that had never
      # once run. The scheme now registers the target, and this step is what
      # actually executes it.
      - name: Run Unit Tests
        id: test
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Verify Swift iOS Package" test \
            "checkout:Checkout Repository|audit:Security Audit|resolve:Resolve Package Dependencies|build:Build & Typecheck Package|test:Run Unit Tests" \
            "checkout=${{ steps.checkout.outcome }};audit=${{ steps.audit.outcome }};resolve=${{ steps.resolve.outcome }};build=${{ steps.build.outcome }}"
          # Same simulator the Maestro e2e workflow already pins, so the runner
          # is known to have it. xcpretty is used when present purely for
          # readable output -- it is never allowed to mask the exit status, and
          # a failing suite is never re-run just to produce nicer logs.
          if command -v xcpretty >/dev/null 2>&1; then
            set -o pipefail
            xcodebuild test \
              -scheme App \
              -destination "platform=iOS Simulator,name=iPhone 17 Pro" \
              CODE_SIGNING_ALLOWED=NO | xcpretty
          else
            xcodebuild test \
              -scheme App \
              -destination "platform=iOS Simulator,name=iPhone 17 Pro" \
              CODE_SIGNING_ALLOWED=NO
          fi

      # Booting a simulator leaves it running, and a running Simulator.app is
      # hundreds of MB of RSS that the next job on this host inherits. Shut it
      # down and print the host state either way, so a red build on a calm box
      # stays distinguishable from a red build on a thrashing one.
      - name: Simulator Hygiene & Host Postmortem
        if: always()
        run: |
          echo "🧹 Shutting down simulators left running by the test run..."
          xcrun simctl shutdown all 2>/dev/null || true
          ./scripts/host-pressure.sh --report

  deploy-mobile:
    name: Deploy iOS & macOS App (TestFlight / Xcode Cloud)
    needs: [lint-swift, skip-verify, verify-swift]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 15
    concurrency:
      group: ci-mobile-deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout Repository
        id: checkout
        uses: actions/checkout@v7

      - name: Check Apple Distribution Secrets & Trigger Deployment
        id: deploy
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Deploy iOS & macOS App (TestFlight / Xcode Cloud)" deploy \
            "checkout:Checkout Repository|deploy:Check Apple Distribution Secrets & Trigger Deployment" \
            "checkout=${{ steps.checkout.outcome }}"
          if [ -z "$APP_STORE_CONNECT_API_KEY" ]; then
            echo "No App Store Connect API key configured in secrets. Relying on Xcode Cloud / native Git integration for TestFlight release."
            exit 0
          fi
          echo "Executing Apple App Store Connect / TestFlight deployment pipeline..."

  sentry-release:
    name: Create Sentry Release (App)
    needs: [verify-swift]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Sentry Secrets
        id: secrets
        run: |
          if [ -z "${{ secrets.SENTRY_AUTH_TOKEN }}" ]; then
            echo "SENTRY_AUTH_TOKEN not configured — skipping Sentry release."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "Sentry secrets configured — proceeding with release."
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Sentry Release
        if: steps.secrets.outputs.available == 'true'
        uses: getsentry/action-release@v1
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || secrets.SENTRY_ORG || 'organicnz' }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || secrets.SENTRY_PROJECT || 'audiobookphile' }}
        with:
          environment: production
          version: ${{ github.sha }}
          set_commits: auto
          ignore_missing: true
          ignore_empty: true