name: CI Mobile Verification (Skip & Swift)

on:
  push:
    branches: [ main ]
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'Project.xcworkspace/**'
      - '.github/workflows/ci-mobile.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - 'Package.resolved'
  workflow_dispatch:
concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-swift:
    name: SwiftLint
    runs-on: [self-hosted, macOS]
    steps:
      - name: Checkout Repository
        id: checkout
        uses: actions/checkout@v7

      - name: Install SwiftLint
        id: install
        run: |
          . .github/scripts/step-tree.sh
          step_tree "SwiftLint" install \
            "checkout:Checkout Repository|install:Install SwiftLint|lint:Run SwiftLint" \
            "checkout=${{ steps.checkout.outcome }}"
          which swiftlint >/dev/null 2>&1 || brew install swiftlint

      - name: Run SwiftLint
        id: lint
        run: |
          . .github/scripts/step-tree.sh
          step_tree "SwiftLint" lint \
            "checkout:Checkout Repository|install:Install SwiftLint|lint:Run SwiftLint" \
            "checkout=${{ steps.checkout.outcome }};install=${{ steps.install.outcome }}"
          swiftlint --strict

  skip-verify:
    name: Skip Cross-Platform Verify
    runs-on: [self-hosted, macOS]
    steps:
      - name: Checkout Repository
        id: checkout
        uses: actions/checkout@v7

      - name: Setup Java
        id: java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Skip
        id: install
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Skip Cross-Platform Verify" install \
            "checkout:Checkout Repository|java:Setup Java|install:Install Skip|verify:Skip Verify" \
            "checkout=${{ steps.checkout.outcome }};java=${{ steps.java.outcome }}"
          which skip >/dev/null 2>&1 || brew install skiptools/skip/skip

      - name: Skip Verify
        id: verify
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Skip Cross-Platform Verify" verify \
            "checkout:Checkout Repository|java:Setup Java|install:Install Skip|verify:Skip Verify" \
            "checkout=${{ steps.checkout.outcome }};java=${{ steps.java.outcome }};install=${{ steps.install.outcome }}"
          skip verify --fix

  verify-swift:
    name: Verify Swift iOS Package
    runs-on: [self-hosted, macOS]
    steps:
      - name: Checkout Repository
        id: checkout
        uses: actions/checkout@v7

      - name: Select Xcode Toolchain
        id: toolchain
        run: |
          if [ -d "/Applications/Xcode-beta.app/Contents/Developer" ]; then
            DEV_DIR="/Applications/Xcode-beta.app/Contents/Developer"
          elif [ -d "/Applications/Xcode.app/Contents/Developer" ]; then
            DEV_DIR="/Applications/Xcode.app/Contents/Developer"
          else
            DEV_DIR="$(xcode-select -p)"
          fi
          echo "$DEV_DIR/Toolchains/XcodeDefault.xctoolchain/usr/bin" >> "$GITHUB_PATH"
          echo "DEVELOPER_DIR=$DEV_DIR" >> "$GITHUB_ENV"
          swift --version

      - name: Security Audit
        id: audit
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Verify Swift iOS Package" audit \
            "checkout:Checkout Repository|audit:Security Audit|resolve:Resolve Package Dependencies|build:Build & Typecheck Package|test:Run Unit Tests" \
            "checkout=${{ steps.checkout.outcome }}"
          ./scripts/security-audit.sh

      - name: Resolve Package Dependencies
        id: resolve
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Verify Swift iOS Package" resolve \
            "checkout:Checkout Repository|audit:Security Audit|resolve:Resolve Package Dependencies|build:Build & Typecheck Package|test:Run Unit Tests" \
            "checkout=${{ steps.checkout.outcome }};audit=${{ steps.audit.outcome }}"
          swift package resolve

      - name: Build & Typecheck Package
        id: build
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Verify Swift iOS Package" build \
            "checkout:Checkout Repository|audit:Security Audit|resolve:Resolve Package Dependencies|build:Build & Typecheck Package|test:Run Unit Tests" \
            "checkout=${{ steps.checkout.outcome }};audit=${{ steps.audit.outcome }};resolve=${{ steps.resolve.outcome }}"
          xcodebuild build-for-testing -scheme Audiobookphile -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO -quiet

      # `build-for-testing` only COMPILES the test bundle; it never runs it. The
      # App scheme's TestAction had an empty <Testables> list, so the
      # AudiobookphileTests target was never built and never executed anywhere
      # in CI -- the playback state machine had tests on disk that had never
      # once run. The scheme now registers the target, and this step is what
      # actually executes it.
      - name: Run Unit Tests
        id: test
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Verify Swift iOS Package" test \
            "checkout:Checkout Repository|audit:Security Audit|resolve:Resolve Package Dependencies|build:Build & Typecheck Package|test:Run Unit Tests" \
            "checkout=${{ steps.checkout.outcome }};audit=${{ steps.audit.outcome }};resolve=${{ steps.resolve.outcome }};build=${{ steps.build.outcome }}"
          # Same simulator the Maestro e2e workflow already pins, so the runner
          # is known to have it. xcpretty is used when present purely for
          # readable output -- it is never allowed to mask the exit status, and
          # a failing suite is never re-run just to produce nicer logs.
          if command -v xcpretty >/dev/null 2>&1; then
            set -o pipefail
            xcodebuild test \
              -scheme App \
              -destination "platform=iOS Simulator,name=iPhone 17 Pro" \
              CODE_SIGNING_ALLOWED=NO | xcpretty
          else
            xcodebuild test \
              -scheme App \
              -destination "platform=iOS Simulator,name=iPhone 17 Pro" \
              CODE_SIGNING_ALLOWED=NO
          fi

  deploy-mobile:
    name: Deploy iOS & macOS App (TestFlight / Xcode Cloud)
    needs: [lint-swift, skip-verify, verify-swift]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 15
    concurrency:
      group: ci-mobile-deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout Repository
        id: checkout
        uses: actions/checkout@v7

      - name: Check Apple Distribution Secrets & Trigger Deployment
        id: deploy
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Deploy iOS & macOS App (TestFlight / Xcode Cloud)" deploy \
            "checkout:Checkout Repository|deploy:Check Apple Distribution Secrets & Trigger Deployment" \
            "checkout=${{ steps.checkout.outcome }}"
          if [ -z "$APP_STORE_CONNECT_API_KEY" ]; then
            echo "No App Store Connect API key configured in secrets. Relying on Xcode Cloud / native Git integration for TestFlight release."
            exit 0
          fi
          echo "Executing Apple App Store Connect / TestFlight deployment pipeline..."

  sentry-release:
    name: Create Sentry Release (App)
    needs: [verify-swift]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Sentry Secrets
        id: secrets
        run: |
          if [ -z "${{ secrets.SENTRY_AUTH_TOKEN }}" ]; then
            echo "SENTRY_AUTH_TOKEN not configured — skipping Sentry release."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "Sentry secrets configured — proceeding with release."
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Sentry Release
        if: steps.secrets.outputs.available == 'true'
        uses: getsentry/action-release@v1
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || secrets.SENTRY_ORG || 'organicnz' }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || secrets.SENTRY_PROJECT || 'audiobookphile' }}
        with:
          environment: production
          version: ${{ github.sha }}
          set_commits: auto
          ignore_missing: true
          ignore_empty: true