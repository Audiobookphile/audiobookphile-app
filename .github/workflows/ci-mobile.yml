name: CI Mobile Verification (Skip & Swift)

on:
  push:
    branches: [ main ]
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'Project.xcworkspace/**'
      - 'scripts/**'
      - 'exportOptions*.plist'
      - '.github/workflows/ci-mobile.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'scripts/**'
  workflow_dispatch:
concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-swift:
    name: SwiftLint
    runs-on: ${{ vars.MOBILE_RUNNER != '' && fromJSON(vars.MOBILE_RUNNER) || 'macos-15' }}
    # These three jobs had no timeout, so a wedged simulator or a Gradle daemon
    # that never returned held a self-hosted runner for the full 6-hour default.
    # With three repos sharing one host, a single hung job starves the others.
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        id: checkout
        uses: actions/checkout@v7

      - name: Host Pressure Preflight
        id: host
        run: ./scripts/host-pressure.sh

      - name: Install SwiftLint
        id: install
        run: |
          . .github/scripts/step-tree.sh
          step_tree "SwiftLint" install \
            "checkout:Checkout Repository|install:Install SwiftLint|lint:Run SwiftLint" \
            "checkout=${{ steps.checkout.outcome }}"
          which swiftlint >/dev/null 2>&1 || brew install swiftlint

      - name: Run SwiftLint
        id: lint
        run: |
          . .github/scripts/step-tree.sh
          step_tree "SwiftLint" lint \
            "checkout:Checkout Repository|install:Install SwiftLint|lint:Run SwiftLint" \
            "checkout=${{ steps.checkout.outcome }};install=${{ steps.install.outcome }}"
          swiftlint --strict

  skip-verify:
    name: Skip Cross-Platform Verify
    runs-on: ${{ vars.MOBILE_RUNNER != '' && fromJSON(vars.MOBILE_RUNNER) || 'macos-15' }}
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        id: checkout
        uses: actions/checkout@v7

      - name: Host Pressure Preflight
        id: host
        run: ./scripts/host-pressure.sh

      # Recorded BEFORE the Gradle build so the reap step below can tell this
      # job's daemons from daemons that were already on the shared host.
      - name: Snapshot Pre-existing Build Daemons
        id: daemons_before
        run: ./scripts/reap-daemons.sh --snapshot "$RUNNER_TEMP/daemons-before.txt"

      - name: Setup Java
        id: java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Skip
        id: install
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Skip Cross-Platform Verify" install \
            "checkout:Checkout Repository|java:Setup Java|install:Install Skip|verify:Skip Verify" \
            "checkout=${{ steps.checkout.outcome }};java=${{ steps.java.outcome }}"
          which skip >/dev/null 2>&1 || brew install skiptools/skip/skip

      - name: Skip Verify
        id: verify
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Skip Cross-Platform Verify" verify \
            "checkout:Checkout Repository|java:Setup Java|install:Install Skip|verify:Skip Verify" \
            "checkout=${{ steps.checkout.outcome }};java=${{ steps.java.outcome }};install=${{ steps.install.outcome }}"
          skip verify --fix

      # `skip verify` drives a real Gradle build, and Gradle leaves behind two
      # long-lived daemons: the Gradle daemon and the Kotlin compile daemon.
      # On a self-hosted runner those OUTLIVE the job -- measured on this host at
      # ~1.4 GB resident and ~440% CPU, still running long after the workflow had
      # finished, with 8 GB of swap in use. Every later job on the same box then
      # starts into a host that is already thrashing, which is how an unrelated
      # change comes back red.
      #
      # Only the daemons that appeared during THIS job are killed: the runners for
      # all three repos share this host with the developer's own work, and a
      # blanket `pkill -f KotlinCompileDaemon` from CI would reach into someone
      # else's in-flight Android build. The job's result is already recorded by
      # the step above, so reaping can never mask a failure.
      - name: Reap This Job's Build Daemons
        if: always()
        run: ./scripts/reap-daemons.sh --reap "$RUNNER_TEMP/daemons-before.txt"

  verify-swift:
    name: Verify Swift iOS Package
    runs-on: ${{ vars.MOBILE_RUNNER != '' && fromJSON(vars.MOBILE_RUNNER) || 'macos-15' }}
    # build-for-testing plus a simulator test run on a shared, memory-constrained
    # host. 45 is generous; the point is that it is not unbounded.
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        id: checkout
        uses: actions/checkout@v7

      - name: Host Pressure Preflight
        id: host
        run: ./scripts/host-pressure.sh

      - name: Select Xcode Toolchain
        id: toolchain
        run: |
          if [ -d "/Applications/Xcode-beta.app/Contents/Developer" ]; then
            DEV_DIR="/Applications/Xcode-beta.app/Contents/Developer"
          elif [ -d "/Applications/Xcode.app/Contents/Developer" ]; then
            DEV_DIR="/Applications/Xcode.app/Contents/Developer"
          else
            DEV_DIR="$(xcode-select -p)"
          fi
          echo "$DEV_DIR/Toolchains/XcodeDefault.xctoolchain/usr/bin" >> "$GITHUB_PATH"
          echo "DEVELOPER_DIR=$DEV_DIR" >> "$GITHUB_ENV"
          swift --version

      - name: Security Audit
        id: audit
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Verify Swift iOS Package" audit \
            "checkout:Checkout Repository|audit:Security Audit|resolve:Resolve Package Dependencies|build:Build & Typecheck Package|test:Run Unit Tests" \
            "checkout=${{ steps.checkout.outcome }}"
          ./scripts/security-audit.sh

      - name: Resolve Package Dependencies
        id: resolve
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Verify Swift iOS Package" resolve \
            "checkout:Checkout Repository|audit:Security Audit|resolve:Resolve Package Dependencies|build:Build & Typecheck Package|test:Run Unit Tests" \
            "checkout=${{ steps.checkout.outcome }};audit=${{ steps.audit.outcome }}"
          swift package resolve

      - name: Build & Typecheck Package
        id: build
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Verify Swift iOS Package" build \
            "checkout:Checkout Repository|audit:Security Audit|resolve:Resolve Package Dependencies|build:Build & Typecheck Package|test:Run Unit Tests" \
            "checkout=${{ steps.checkout.outcome }};audit=${{ steps.audit.outcome }};resolve=${{ steps.resolve.outcome }}"
          xcodebuild build-for-testing \
            -scheme Audiobookphile \
            -destination "generic/platform=iOS Simulator" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO -quiet

      # `build-for-testing` only COMPILES the test bundle; it never runs it. The
      # App scheme's TestAction had an empty <Testables> list, so the
      # AudiobookphileTests target was never built and never executed anywhere
      # in CI -- the playback state machine had tests on disk that had never
      # once run. The scheme now registers the target, and this step is what
      # actually executes it.
      - name: Run Unit Tests
        id: test
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Verify Swift iOS Package" test \
            "checkout:Checkout Repository|audit:Security Audit|resolve:Resolve Package Dependencies|build:Build & Typecheck Package|test:Run Unit Tests" \
            "checkout=${{ steps.checkout.outcome }};audit=${{ steps.audit.outcome }};resolve=${{ steps.resolve.outcome }};build=${{ steps.build.outcome }}"
          SIM_NAME=$(xcrun simctl list devices available | grep -E "iPhone (16|15|17|SE)" | head -n 1 | sed -E 's/^[ ]*//; s/ \([0-9A-F-]+\).*//' || echo "iPhone 16")
          [ -z "$SIM_NAME" ] && SIM_NAME="iPhone 16"
          echo "Testing on simulator: $SIM_NAME"
          if command -v xcpretty >/dev/null 2>&1; then
            set -o pipefail
            xcodebuild test \
              -scheme App \
              -destination "platform=iOS Simulator,name=$SIM_NAME" \
              -skipPackagePluginValidation \
              -skipMacroValidation \
              CODE_SIGNING_ALLOWED=NO | xcpretty
          else
            xcodebuild test \
              -scheme App \
              -destination "platform=iOS Simulator,name=$SIM_NAME" \
              -skipPackagePluginValidation \
              -skipMacroValidation \
              CODE_SIGNING_ALLOWED=NO
          fi

      # Booting a simulator leaves it running, and a running Simulator.app is
      # hundreds of MB of RSS that the next job on this host inherits. Shut it
      # down and print the host state either way, so a red build on a calm box
      # stays distinguishable from a red build on a thrashing one.
      - name: Simulator Hygiene & Host Postmortem
        if: always()
        run: |
          echo "🧹 Shutting down simulators left running by the test run..."
          xcrun simctl shutdown all 2>/dev/null || true
          ./scripts/host-pressure.sh --report

  deploy-mobile:
    name: Deploy iOS & macOS App (TestFlight / Xcode Cloud)
    needs: [lint-swift, skip-verify, verify-swift]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.MOBILE_RUNNER != '' && fromJSON(vars.MOBILE_RUNNER) || 'macos-15' }}
    timeout-minutes: 30
    concurrency:
      group: ci-mobile-deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout Repository
        id: checkout
        uses: actions/checkout@v7

      - name: Configure App Store Credentials & Deploy to TestFlight
        id: deploy
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 || secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID || '3B28BL42D3' }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID || '69a6de8f-c4a2-47e3-e053-5b8c7c11a4d1' }}
          DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM || 'DCKVD6LKYV' }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          EXPORT_OPTIONS_PLIST: ${{ secrets.EXPORT_OPTIONS_PLIST }}
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Deploy iOS & macOS App (TestFlight / Xcode Cloud)" deploy \
            "checkout:Checkout Repository|deploy:Configure App Store Credentials & Deploy to TestFlight" \
            "checkout=${{ steps.checkout.outcome }}"

          if [ -z "$APP_STORE_CONNECT_API_KEY_BASE64" ]; then
            echo "ℹ️ No App Store Connect API key configured in secrets. Relying on Xcode Cloud / native Git integration for TestFlight release."
            exit 0
          fi

          # Ensure Xcode toolchain is active
          if [ -d "/Applications/Xcode-beta.app/Contents/Developer" ]; then
            export DEVELOPER_DIR="/Applications/Xcode-beta.app/Contents/Developer"
          elif [ -d "/Applications/Xcode.app/Contents/Developer" ]; then
            export DEVELOPER_DIR="/Applications/Xcode.app/Contents/Developer"
          fi
          echo "Using DEVELOPER_DIR=$DEVELOPER_DIR"
          xcodebuild -version

          echo "🔐 App Store Connect API key detected. Setting up credentials..."
          export ASC_KEY_ID="$APP_STORE_CONNECT_API_KEY_ID"
          export ASC_ISSUER_ID="$APP_STORE_CONNECT_API_ISSUER_ID"
          export DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM"

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          ASC_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          export ASC_KEY_PATH

          # Setup export options plist if not present
          if [ ! -f exportOptions-appstore.plist ]; then
            if [ -n "$EXPORT_OPTIONS_PLIST" ]; then
              echo "$EXPORT_OPTIONS_PLIST" | base64 --decode > exportOptions-appstore.plist 2>/dev/null || echo "$EXPORT_OPTIONS_PLIST" > exportOptions-appstore.plist
            fi
          fi

          # Setup temporary keychain and signing certificate if provided
          if [ -n "$BUILD_CERTIFICATE_BASE64" ] && [ -n "$P12_PASSWORD" ]; then
            echo "🔑 Installing iOS Distribution signing certificate in temporary keychain..."
            KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
            KEYCHAIN_PWD="${KEYCHAIN_PASSWORD:-$(uuidgen)}"
            CERT_PATH="$RUNNER_TEMP/build_certificate.p12"

            echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

            security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

            security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

            if [ -n "$BUILD_PROVISION_PROFILE_BASE64" ]; then
              echo "📱 Installing provisioning profile..."
              mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
              PP_TMP="$RUNNER_TEMP/temp.mobileprovision"
              echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PP_TMP"
              PP_UUID=$(security cms -D -i "$PP_TMP" 2>/dev/null | plutil -extract UUID raw - 2>/dev/null || echo "app_distribution")
              cp "$PP_TMP" "$HOME/Library/MobileDevice/Provisioning Profiles/${PP_UUID}.mobileprovision"
              cp "$PP_TMP" "$HOME/Library/MobileDevice/Provisioning Profiles/build_pp.mobileprovision"
            fi
          fi

          echo "🚀 Executing automated TestFlight distribution pipeline..."
          ./scripts/distribute.sh all-testflight --whats-new "Audiobookphile automated build from main (${{ github.sha }})"

      - name: Clean up temporary credentials & keychain
        if: always()
        run: |
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_"*.p8 || true
          if [ -f "$RUNNER_TEMP/app-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
            security default-keychain -d user -s "$HOME/Library/Keychains/login.keychain-db" 2>/dev/null || true
            security list-keychains -d user -s "$HOME/Library/Keychains/login.keychain-db" "/Library/Keychains/System.keychain" 2>/dev/null || true
          fi

  sentry-release:
    name: Create Sentry Release (App)
    needs: [verify-swift]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.MOBILE_RUNNER != '' && fromJSON(vars.MOBILE_RUNNER) || 'macos-15' }}
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Sentry Secrets
        id: secrets
        run: |
          if [ -z "${{ secrets.SENTRY_AUTH_TOKEN }}" ]; then
            echo "SENTRY_AUTH_TOKEN not configured — skipping Sentry release."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "Sentry secrets configured — proceeding with release."
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Sentry Release
        if: steps.secrets.outputs.available == 'true'
        uses: getsentry/action-release@v1
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || secrets.SENTRY_ORG || 'organicnz' }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || secrets.SENTRY_PROJECT || 'audiobookphile' }}
        with:
          environment: production
          version: ${{ github.sha }}
          set_commits: auto
          ignore_missing: true
          ignore_empty: true
